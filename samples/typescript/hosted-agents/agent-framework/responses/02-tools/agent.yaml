# Foundry Hosted Agent definition.
# Schema: microsoft/AgentSchema ContainerAgent.yaml
kind: hosted
name: agent-framework-agent-with-local-tools-responses-ts
description: An Agent Framework (TypeScript) agent with local tools hosted by Foundry.

protocols:
  - protocol: responses
    version: 2.0.0

resources:
  cpu: '0.5'
  memory: 1Gi

environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
