# Foundry Hosted Agent definition.
# Schema: microsoft/AgentSchema ContainerAgent.yaml
kind: hosted
name: agent-framework-content-safety-guardrail-ts
displayName: Content safety guardrail (Agent Framework TypeScript, Responses)
description: An Agent Framework (TypeScript) agent hosted by Foundry with a Responsible AI content safety guardrail. The guardrail screens prompts and responses against an RAI policy, so harmful content is filtered according to your safety configuration.

protocols:
  - protocol: responses
    version: 2.0.0

resources:
  cpu: '0.5'
  memory: 1Gi

environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}

# The content safety guardrail. Replace raiPolicyName with the full ARM resource ID of an RAI
# policy that exists on your Foundry account — a nonexistent policy (including this placeholder)
# may deploy successfully but apply NO content filtering (the guardrail fails open).
policies:
  - type: rai_policy
    raiPolicyName: /subscriptions/<subscription-id>/resourceGroups/<resource-group>/providers/Microsoft.CognitiveServices/accounts/<account>/raiPolicies/<policy-name>
