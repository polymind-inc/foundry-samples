# Foundry Hosted Agent definition.
# Schema: microsoft/AgentSchema ContainerAgent.yaml
kind: hosted
name: agent-framework-content-safety-guardrail-ts
displayName: Content safety guardrail (Agent Framework TypeScript, Responses)
description: An Agent Framework (TypeScript) agent hosted by Foundry with a Responsible AI content safety guardrail. The guardrail screens prompts and responses against an RAI policy, so harmful content is filtered according to your safety configuration.

protocols:
  - protocol: responses
    version: 2.0.0

resources:
  cpu: '0.5'
  memory: 1Gi

environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}

# The content safety guardrail. RAI_POLICY_RESOURCE_ID must be set in the active deployment
# environment (for example, the selected azd environment) to the full ARM resource ID of a
# policy on the Foundry account. A nonexistent policy may deploy successfully but apply NO
# content filtering (the guardrail fails open).
policies:
  - type: rai_policy
    raiPolicyName: ${RAI_POLICY_RESOURCE_ID}
