# Foundry Hosted Agent definition.
# Schema: microsoft/AgentSchema ContainerAgent.yaml
kind: hosted
name: agent-framework-agent-azure-search-rag-responses-ts
description: An Agent Framework (TypeScript) agent with Retrieval Augmented Generation (RAG) capabilities backed by Azure AI Search. A custom context provider grounds answers in product documentation indexed in Azure AI Search before each model invocation.

protocols:
  - protocol: responses
    version: 2.0.0

resources:
  cpu: '0.5'
  memory: 1Gi

environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: AZURE_SEARCH_ENDPOINT
    value: ${AZURE_SEARCH_ENDPOINT}
  - name: AZURE_SEARCH_INDEX_NAME
    value: ${AZURE_SEARCH_INDEX_NAME}
