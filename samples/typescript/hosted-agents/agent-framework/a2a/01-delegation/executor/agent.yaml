# Foundry Hosted Agent definition.
# Schema: microsoft/AgentSchema ContainerAgent.yaml
kind: hosted
name: agent-framework-a2a-executor-responses-ts
description: >-
  An Agent Framework (TypeScript) hosted agent (Responses protocol) that answers
  arithmetic / math questions. Once deployed, run `scripts/setup-a2a.{sh,ps1}` to
  turn on incoming A2A so other Foundry agents can reach it through Foundry's A2A
  endpoint.

protocols:
  - protocol: responses
    version: 2.0.0

resources:
  cpu: '0.5'
  memory: 1Gi

environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
